<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2C0"/>
      <stop offset="30%" stop-color="#D1B386"/>
      <stop offset="65%" stop-color="#F5DEBC"/>
      <stop offset="100%" stop-color="#9C7B4F"/>
    </linearGradient>
    <filter id="goldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- New Original Luxury Dental Emblem (Faceted Onyx & Golden Molar Contour) -->
  <g id="brand-emblem" filter="url(#goldShadow)">
    <!-- Top Left Crown Cusp (Flowing Golden Ribbon) -->
    <path d="M 250 115 C 220 95, 175 90, 145 125 C 115 160, 120 220, 150 270 C 170 305, 185 350, 195 400 C 200 410, 208 405, 210 390 C 215 330, 210 295, 235 265 C 245 255, 248 245, 248 235 C 248 215, 230 200, 215 190 C 190 175, 175 155, 185 135 C 195 118, 225 118, 250 135 Z" fill="url(#goldGradient)"/>
    
    <!-- Top Right Crown Cusp (Symmetrical Balanced Ribbon) -->
    <path d="M 250 115 C 280 95, 325 90, 355 125 C 385 160, 380 220, 350 270 C 330 305, 315 350, 305 400 C 300 410, 292 405, 290 390 C 285 330, 290 295, 265 265 C 255 255, 252 245, 252 235 C 252 215, 270 200, 285 190 C 310 175, 325 155, 315 135 C 305 118, 275 118, 250 135 Z" fill="url(#goldGradient)"/>

    <!-- Central Onyx Facet Diamond (Symbolizing the Onyx Mineral) -->
    <path d="M 250 160 L 268 188 L 250 216 L 232 188 Z" fill="url(#goldGradient)"/>
    <circle cx="250" cy="188" r="3" fill="#0E1013"/>
  </g>

  <!-- Typography: Elegant, Balanced & Refined -->
  <text x="250" y="445" 
        text-anchor="middle" 
        fill="currentColor" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-size="44" 
        font-weight="600" 
        letter-spacing="12">ОНИКС</text>

  <text x="250" y="475" 
        text-anchor="middle" 
        fill="url(#goldGradient)" 
        font-family="'Manrope', sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="8">FIRST DENTAL GROUP</text>
</svg>